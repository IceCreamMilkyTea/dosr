\* ReviewIntent extension, MaxAttempts = 1: with a single attempt per
\* (base, candidate) the NoGrinding property HOLDS.  Adversary: 2 LLM calls,
\* 1 transaction.  The 2-call/2-tx version is large/IntentsNoGrinding.cfg
\* (holds, 13.3 M states, 229 s on an idle machine).
SPECIFICATION Spec
CONSTANTS
    Commits         <- Commits3
    Parent          <- Forest3
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = TRUE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = TRUE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 4
    MaxReceipts     = 3
    MaxRejects      = 3
    MaxByzCalls     = 2
    MaxByzTxs       = 1
    MaxPolicyTxs    = 0
    MaxCrashes      = 0
INVARIANTS
    TypeOK
    CertifiedHistory
    LinearHistory
    NoStaleAccept
    PolicyBinding
    PolicyAuthorised
    NoReceiptReuse
    PrefixConsistency
    Determinism
    IntentBinding
    BoundedAttempts
    NoGrinding
