\* Liveness without Byzantine interference: 2 honest contributors, 2 replicas,
\* 1 crash, 1 policy update, the LLM rejects at most once.
\* Bounds: 5 receipts leave room for 1 reject, 2 approvals wasted by the policy update and the accepted one.
SPECIFICATION LiveSpec
CONSTANTS
    Commits         <- Commits3
    Parent          <- Forest3
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1, r2}
    Honest          = {h1, h2}
    Byzantine       = {}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = FALSE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = FALSE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 5
    MaxReceipts     = 5
    MaxRejects      = 1
    MaxByzCalls     = 0
    MaxByzTxs       = 0
    MaxPolicyTxs    = 1
    MaxCrashes      = 1
INVARIANTS
    TypeOK
PROPERTIES
    Progress
