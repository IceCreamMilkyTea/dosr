\* Liveness with bounded Byzantine interference (1 LLM call, 1 transaction),
\* two root commits a, b (Progress only needs the first accept).
\* Bounds: log = 1 Byzantine tx + 1 policy update + 2 accepts wasted by the update (a and b under p1) + 1 = 5;
\* receipts = 1 reject + 1 Byzantine call + 2 wasted approvals + 1 = 5.
\* large/LivenessByz_Forest3.cfg is the same with Forest3 (holds, 8.2 M states, 228 s idle);
\* large/LivenessByz.cfg is the original (log 6, receipts 6, 2 rejects, 2 Byzantine txs): 4 h 17 min,
\* 521 M states, crashed with the disk full, no verdict.
SPECIFICATION LiveSpec
CONSTANTS
    Commits         <- Commits2
    Parent          <- Forest2
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = FALSE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = FALSE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 5
    MaxReceipts     = 5
    MaxRejects      = 1
    MaxByzCalls     = 1
    MaxByzTxs       = 1
    MaxPolicyTxs    = 1
    MaxCrashes      = 0
INVARIANTS
    TypeOK
PROPERTIES
    Progress
