\* Liveness with the ReviewIntent extension, no Byzantine interference.
SPECIFICATION LiveSpec
CONSTANTS
    Commits         <- Commits2
    Parent          <- Forest2
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = TRUE
    MaxAttempts     = 2
    FullAdversary   = FALSE
    UniqueSessions  = FALSE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 5
    MaxReceipts     = 4
    MaxRejects      = 1
    MaxByzCalls     = 0
    MaxByzTxs       = 0
    MaxPolicyTxs    = 0
    MaxCrashes      = 0
INVARIANTS
    TypeOK
PROPERTIES
    Progress
