\* Replica agreement: 3 replicas that lag, crash (2 crashes) and restart from
\* their persisted prefix.
SPECIFICATION Spec
CONSTANTS
    Commits         <- Commits3
    Parent          <- Forest3
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1, r2, r3}
    Honest          = {h1}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = FALSE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = FALSE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 3
    MaxReceipts     = 2
    MaxRejects      = 1
    MaxByzCalls     = 0
    MaxByzTxs       = 1
    MaxPolicyTxs    = 1
    MaxCrashes      = 2
SYMMETRY ReplicaSymmetry
INVARIANTS
    TypeOK
    CertifiedHistory
    LinearHistory
    NoStaleAccept
    PolicyBinding
    PolicyAuthorised
    NoReceiptReuse
    PrefixConsistency
    Determinism
