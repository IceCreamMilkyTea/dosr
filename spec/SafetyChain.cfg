\* Safety, deep model: forest of 5 commits (chain a-c-e, siblings a/b and c/d),
\* log of 5 transactions, honest contributor + reduced Byzantine adversary
\* (1 LLM call, 1 transaction), one policy update, one lagging replica.
\* 3 receipts: exactly enough for the chain a-c-e; the 4-receipt version is large/SafetyChain.cfg
\* (holds, 21.0 M states, 202 s on an idle machine, 412 s on a loaded one).
SPECIFICATION Spec
CONSTANTS
    Commits         <- Commits5
    Parent          <- Forest5
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = FALSE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = FALSE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 5
    MaxReceipts     = 3
    MaxRejects      = 1
    MaxByzCalls     = 1
    MaxByzTxs       = 1
    MaxPolicyTxs    = 1
    MaxCrashes      = 0
INVARIANTS
    TypeOK
    CertifiedHistory
    LinearHistory
    NoStaleAccept
    PolicyBinding
    PolicyAuthorised
    NoReceiptReuse
    PrefixConsistency
    Determinism
