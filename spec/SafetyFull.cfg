\* Safety, FULL adversary (every request, every transaction, every forged
\* record), small constants.  Cross-checks the single-fault reduction used in
\* the other models.
SPECIFICATION Spec
CONSTANTS
    Commits         <- Commits2
    Parent          <- Forest2
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = FALSE
    MaxAttempts     = 1
    FullAdversary   = TRUE
    UniqueSessions  = FALSE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 2
    MaxReceipts     = 1
    MaxRejects      = 1
    MaxByzCalls     = 1
    MaxByzTxs       = 2
    MaxPolicyTxs    = 1
    MaxCrashes      = 0
INVARIANTS
    TypeOK
    CertifiedHistory
    LinearHistory
    NoStaleAccept
    PolicyBinding
    PolicyAuthorised
    NoReceiptReuse
    PrefixConsistency
    Determinism
