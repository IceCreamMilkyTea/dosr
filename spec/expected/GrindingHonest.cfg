\* Approval grinding needs no Byzantine behaviour at all: an honest contributor
\* that simply asks again.
\* EXPECTED: invariant NoGrinding is violated.
SPECIFICATION Spec
CONSTANTS
    Commits         <- Commits3
    Parent          <- Forest3
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = FALSE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = TRUE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 2
    MaxReceipts     = 3
    MaxRejects      = 2
    MaxByzCalls     = 0
    MaxByzTxs       = 0
    MaxPolicyTxs    = 0
    MaxCrashes      = 0
INVARIANTS
    NoGrinding
