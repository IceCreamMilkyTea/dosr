    MaxLogLen       = 4
    MaxReceipts     = 3
    MaxRejects      = 3
    MaxByzCalls     = 2
    MaxByzTxs       = 2
    MaxPolicyTxs    = 0
    MaxCrashes      = 0
INVARIANTS
    NoGrinding
