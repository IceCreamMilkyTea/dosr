    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = TRUE
    MaxAttempts     = 2
    FullAdversary   = FALSE
    UniqueSessions  = TRUE
    TrackEpoch      = FALSE
