SPECIFICATION Spec
CONSTANTS
    Commits         <- Commits3
    Parent          <- Forest3
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = TRUE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = TRUE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 4
    MaxReceipts     = 3
    MaxRejects      = 3
    MaxByzCalls     = 2
    MaxByzTxs       = 2
    MaxPolicyTxs    = 0
    MaxCrashes      = 0
INVARIANTS
    TypeOK
    CertifiedHistory
    LinearHistory
    NoStaleAccept
    PolicyBinding
    PolicyAuthorised
    NoReceiptReuse
    PrefixConsistency
    Determinism
    IntentBinding
    BoundedAttempts
    NoGrinding
