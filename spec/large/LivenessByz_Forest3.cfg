\* LARGE MODEL - NOT RUN BY ./run.sh.  Completed on an idle machine but does not fit the 5-minute budget; see large/README.md.
\* Liveness with bounded Byzantine interference (1 LLM call, 1 transaction).
\* Bounds: log = 1 Byzantine tx + 1 policy update + 2 accepts wasted by the update (a and b under p1) + 1 = 5;
\* receipts = 1 reject + 1 Byzantine call + 2 wasted approvals + 1 = 5.  The larger original model (log 6, receipts 6,
\* 2 rejects, 2 Byzantine txs) is in large/LivenessByz.cfg: it ran for 4h17m, 521M states, and crashed (disk full).
SPECIFICATION LiveSpec
CONSTANTS
    Commits         <- Commits3
    Parent          <- Forest3
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = FALSE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = FALSE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 5
    MaxReceipts     = 5
    MaxRejects      = 1
    MaxByzCalls     = 1
    MaxByzTxs       = 1
    MaxPolicyTxs    = 1
    MaxCrashes      = 0
INVARIANTS
    TypeOK
PROPERTIES
    Progress
