\* LARGE MODEL - NOT RUN BY ./run.sh.  Completed on an idle machine but does not fit the 5-minute budget; see large/README.md.
\* Safety, adversary-heavy model: forest of 3 commits, log of 3 transactions,
\* reduced Byzantine adversary with 2 LLM calls and 2 transactions, one policy
\* update, one lagging replica.
SPECIFICATION Spec
CONSTANTS
    Commits         <- Commits3
    Parent          <- Forest3
    None            = "none"
    PolicyHashes    = {"p1", "p2"}
    InitPolicy      = "p1"
    Replicas        = {r1}
    Honest          = {h1}
    Byzantine       = {z1}
    Maintainers     = {m1, m2, m3}
    ByzMaintainers  = {m3}
    Outsider        = x
    Threshold       = 2
    IntentsEnabled  = FALSE
    MaxAttempts     = 1
    FullAdversary   = FALSE
    UniqueSessions  = FALSE
    TrackEpoch      = FALSE
    Guards          <- G_All
    MaxLogLen       = 3
    MaxReceipts     = 3
    MaxRejects      = 3
    MaxByzCalls     = 2
    MaxByzTxs       = 2
    MaxPolicyTxs    = 1
    MaxCrashes      = 0
INVARIANTS
    TypeOK
    CertifiedHistory
    LinearHistory
    NoStaleAccept
    PolicyBinding
    PolicyAuthorised
    NoReceiptReuse
    PrefixConsistency
    Determinism
