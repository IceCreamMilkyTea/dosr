\* MUTANT: guard "intentUnused" removed.  AcceptCommit no longer checks that the intent is unused.
\* EQUIVALENT MUTANT: a nonce can only be consumed twice by accepting a second receipt with the same nonce; "notaryOnce"
\* makes the receipt unique and "head" prevents accepting the same receipt again (the head never returns to receipt.base),
\* so the removed check is implied.  TLC explores the full state space and finds no violation (see README).
\* The double mutant NoIntentUnused_NoHead_IntentBinding shows the guard is load-bearing once the head check is gone.
\* EXPECTED: invariant IntentBinding HOLDS (equivalent mutant).
