\* DOUBLE MUTANT: guards "intentUnused" AND "head" removed.  A consumed intent can be consumed again by replaying its accept.
\* (The single mutant NoIntentUnused is equivalent to the real protocol: the head check already prevents the replay.)
\* EXPECTED: invariant IntentBinding is violated.
SPECIFICATION Spec
