\* MUTANT: guard "notaryIntent" removed.  The notary does not check that the nonce is registered on chain.
\* Constants reduced to the minimum for the witness (log 2, 2 receipts, 1 Byzantine call): the original model
\* (large/NoNotaryIntent_NoGrinding.cfg) blew up at depth 7 (510M states, 2 hours) and crashed when the disk filled.
\* EXPECTED: invariant NoGrinding is violated.
SPECIFICATION Spec
